---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-litestream-io-v1-litestreamrestore
  failurePolicy: Fail
  name: vlitestreamrestore.kb.io
  rules:
  - apiGroups:
    - litestream.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - litestreamrestores
  sideEffects: None
