repos:
  # Standard file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
        exclude: '^charts/.*/templates/'
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending

  # Secrets detection (general)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  # AWS credential detection
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
      - id: detect-private-key

  # Go formatting and vetting
  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.1
    hooks:
      - id: go-fmt
      - id: go-vet-mod
      - id: go-build-mod

  # Go linting (golangci-lint)
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint
        args: ['--timeout=5m']

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args: ['--config', '.markdownlint.yaml']

  # Shell validation
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # Kubernetes operator verification (local hooks using Make targets)
  - repo: local
    hooks:
      - id: verify-generated
        name: Verify generated operator artifacts
        entry: make verify-generated
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: verify-kustomize
        name: Verify Kustomize overlays render
        entry: make verify-kustomize
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: verify-helm
        name: Verify Helm chart
        entry: make verify-helm
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: test
        name: Run tests
        entry: make test
        language: system
        pass_filenames: false
        stages: [pre-commit]
