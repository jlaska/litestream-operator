---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: litestreamrestores.litestream.io
spec:
  group: litestream.io
  names:
    kind: LitestreamRestore
    listKind: LitestreamRestoreList
    plural: litestreamrestores
    singular: litestreamrestore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.sourceRef.name
      name: Source
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          LitestreamRestore triggers a one-shot restore of a SQLite database from a
          Litestream backup stored in S3-compatible object storage.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LitestreamRestoreSpec defines the desired state of a LitestreamRestore
              operation.
            properties:
              force:
                description: |-
                  Force causes the restore Job to pass -force to litestream, overwriting an
                  existing database file at TargetPath. By default, litestream refuses to
                  overwrite a non-empty file. Set this to true only when you intentionally
                  want to replace an existing database (e.g. recovering from a diverged DB).
                type: boolean
              image:
                description: |-
                  Image overrides the Litestream container image used for the restore Job.
                  Defaults to the image specified in the referenced LitestreamReplica, or
                  litestream/litestream:0.5.14 if neither is set.
                type: string
              mode:
                default: InPlace
                description: |-
                  Mode selects the restore strategy.
                  InPlace: derives target from source LitestreamReplica, fences app, restores, resumes.
                  ToPVC: restores to a separate PVC without touching the source application.
                enum:
                - InPlace
                - ToPVC
                type: string
              runAsGroup:
                description: RunAsGroup sets the GID for both the restore Job and
                  the validation Job pods.
                format: int64
                type: integer
              runAsUser:
                description: RunAsUser sets the UID for both the restore Job and the
                  validation Job pods.
                format: int64
                type: integer
              sourceRef:
                description: |-
                  SourceRef identifies the LitestreamReplica whose backup configuration
                  (S3 destination + credentials) should be used as the restore source.
                  The LitestreamReplica must be in the same namespace.
                properties:
                  name:
                    description: Name is the name of the LitestreamReplica CR in the
                      same namespace.
                    type: string
                required:
                - name
                type: object
              target:
                description: |-
                  Target is required when mode is ToPVC. Specifies the PVC and path
                  for the restored database.
                properties:
                  path:
                    description: |-
                      Path is the full path (including filename) where the restored
                      database file will be written inside the PVC.
                    type: string
                  pvc:
                    description: PVC is the name of the PersistentVolumeClaim to restore
                      into.
                    type: string
                required:
                - path
                - pvc
                type: object
              timestamp:
                description: |-
                  Timestamp enables point-in-time recovery. When set, Litestream restores
                  the database to the state it was in at this instant.
                  Format: RFC 3339, e.g. "2026-06-17T10:00:00Z".
                  When omitted the most recent snapshot is restored.
                type: string
            required:
            - sourceRef
            type: object
          status:
            description: LitestreamRestoreStatus defines the observed state of a LitestreamRestore
              operation.
            properties:
              completionTime:
                description: CompletionTime is when the restore Job finished (successfully
                  or not).
                format: date-time
                type: string
              conditions:
                description: Conditions holds standard Kubernetes condition entries.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              jobName:
                description: JobName is the name of the Kubernetes Job created to
                  perform the restore.
                type: string
              message:
                description: |-
                  Message contains a human-readable description of the current phase,
                  including any error details on failure.
                type: string
              originalReplicas:
                description: |-
                  OriginalReplicas records the target Deployment's replica count before
                  scale-down so it can be restored after the restore Job completes.
                format: int32
                type: integer
              phase:
                description: Phase is the current lifecycle state.
                type: string
              resolvedPVC:
                description: ResolvedPVC is the PVC name used for the restore, resolved
                  at reconcile time.
                type: string
              resolvedPath:
                description: ResolvedPath is the database path used for the restore,
                  resolved at reconcile time.
                type: string
              startTime:
                description: StartTime is when the restore Job was created.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
